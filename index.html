<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElMarino - Каталог товарів</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding-bottom: 90px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px;
        }

        /* Categories / Search */
        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #eee;
        }

        .product-info {
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 6px;
            color: #222;
        }

        .product-desc {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-bottom {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #2e7d32;
        }

        .btn-add {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #1565c0;
        }

        /* Floating Cart Bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid #eee;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 12px;
            color: #666;
        }

        .cart-total {
            font-size: 18px;
            font-weight: 700;
            color: #0d47a1;
        }

        .btn-cart {
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(46,125,50,0.3);
        }

        /* Modal / Checkout Screen */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            align-items: flex-end;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 20px 20px 0 0;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 18px;
            color: #111;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #888;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .cart-item-title {
            font-size: 13px;
            font-weight: 500;
            flex-grow: 1;
            padding-right: 10px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qty {
            background: #eee;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .form-group {
            margin-top: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background: #0d47a1;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>ElMarino</h1>
        <p>Оптовий та роздрібний каталог</p>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Пошук товарів..." onkeyup="filterProducts()">
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Товари завантажуються тут -->
        </div>
    </div>

    <!-- Плаваюча кошик-панель -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <span class="cart-count" id="cartCountText">Товарів: 0</span>
            <span class="cart-total" id="cartTotalText">0 грн</span>
        </div>
        <button class="btn-cart" onclick="openModal()">Оформити</button>
    </div>

    <!-- Модальне вікно кошика та оформлення -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ваше замовлення</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div id="cartItemsList">
                <!-- Список товарів кошика -->
            </div>

            <form id="checkoutForm" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label for="userName">Ім'я та Прізвище *</label>
                    <input type="text" id="userName" placeholder="Введіть ваше ім'я" required>
                </div>
                <div class="form-group">
                    <label for="userPhone">Номер телефону *</label>
                    <input type="tel" id="userPhone" placeholder="+380XXXXXXXXX" required>
                </div>

                <div class="loader" id="loader">Надсилання замовлення... Зачекайте ⏳</div>
                <button type="submit" class="btn-submit" id="submitBtn">Підтвердити замовлення</button>
            </form>
        </div>
    </div>

    <script>
        // ==================== НАЛАШТУВАННЯ ====================
        // Ваше робоче посилання Google Apps Script
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzbfPGZ0KELATzymA5XDmP5SBuMYJJwPes9t78OuCCbWpeeqn9PuhR2RVHlu4asY4LO_g/exec';

        // Список товарів (автоматично відображається в каталозі)
        const products = [
            {
                id: 1,
                name: 'Термопакет з клейовою стрічкою',
                desc: 'Надійний термопакет для збереження температури.',
                price: 25,
                image: 'https://i.postimg.cc/zXNW5WKf/1783307351474(1).jpg'
            },
            {
                id: 2,
                name: 'Термосумка 42л',
                desc: 'Велика місткість (42 літри). Розмір: 45×45 см.',
                price: 550,
                image: 'https://i.postimg.cc/90v6DVbB/1785315546226.jpg'
            },
            {
                id: 3,
                name: 'Термосумка Wanderlust 40л',
                desc: 'Стильна та зручна сумка-холодильник.',
                price: 620,
                image: 'https://i.postimg.cc/2560v6Zh/1785485328680.jpg'
            },
            {
                id: 4,
                name: 'Вушка по-корейськи (у вакуумі)',
                desc: 'Соковиті свинячі вушка, нарізані соломкою.',
                price: 65,
                image: 'https://i.postimg.cc/GmBzK4Vj/images.jpg'
            },
            {
                id: 5,
                name: 'Кришка закаточна Хуторянка',
                desc: 'Якісні закаточні кришки в упаковці.',
                price: 120,
                image: 'https://i.postimg.cc/DfstHPH7/1785309810217.jpg'
            },
            {
                id: 6,
                name: 'Вакуумний пакувальник Vacuum Sealer',
                desc: 'Харчовий вакууматор із дисплеєм та пакетами.',
                price: 480,
                image: 'https://i.postimg.cc/90rQXyR2/589925639.webp'
            }
        ];

        let cart = {};

        // Відображення товарів
        function renderProducts(itemsToRender = products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            itemsToRender.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-bottom">
                            <div class="product-price">${p.price} грн</div>
                            <button class="btn-add" onclick="addToCart(${p.id})">+ Додати</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Пошук товарів
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // Управління кошиком
        function addToCart(productId) {
            if (cart[productId]) {
                cart[productId].qty++;
            } else {
                const p = products.find(prod => prod.id === productId);
                cart[productId] = { ...p, qty: 1 };
            }
            updateCartUI();
        }

        function changeQty(productId, delta) {
            if (cart[productId]) {
                cart[productId].qty += delta;
                if (cart[productId].qty <= 0) {
                    delete cart[productId];
                }
            }
            updateCartUI();
            renderCartModalItems();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalCount += item.qty;
                totalPrice += item.price * item.qty;
            });

            document.getElementById('cartCountText').innerText = `Товарів: ${totalCount}`;
            document.getElementById('cartTotalText').innerText = `${totalPrice} грн`;
        }

        // Модальне вікно
        function openModal() {
            if (Object.keys(cart).length === 0) {
                alert('Ваш кошик порожній!');
                return;
            }
            renderCartModalItems();
            document.getElementById('cartModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('cartModal').classList.remove('active');
        }

        function renderCartModalItems() {
            const container = document.getElementById('cartItemsList');
            container.innerHTML = '';

            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                const itemTotal = item.price * item.qty;
                totalPrice += itemTotal;

                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div class="cart-item-title">${item.name} <br><small>${item.price} грн × ${item.qty} = <b>${itemTotal} грн</b></small></div>
                    <div class="cart-item-controls">
                        <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                `;
                container.appendChild(row);
            });

            const totalDiv = document.createElement('div');
            totalDiv.style.cssText = 'text-align: right; font-weight: bold; font-size: 16px; margin: 15px 0; color: #0d47a1;';
            totalDiv.innerText = `Всього: ${totalPrice} грн`;
            container.appendChild(totalDiv);
        }

        // Відправка замовлення в Google Apps Script
        function submitOrder(e) {
            e.preventDefault();

            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();

            if (!name || !phone) {
                alert('Заповніть будь ласка ім\'я та телефон');
                return;
            }

            const itemsArray = Object.values(cart).map(item => ({
                name: item.name,
                qty: item.qty,
                price: item.price,
                total: item.price * item.qty
            }));

            let totalSum = itemsArray.reduce((sum, item) => sum + item.total, 0);

            const payload = {
                name: name,
                phone: phone,
                totalSum: totalSum.toString(),
                items: itemsArray
            };

            // Індикація завантаження
            document.getElementById('loader').style.display = 'block';
            document.getElementById('submitBtn').style.display = 'none';

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('✅ Дякуємо! Ваше замовлення успішно відправлено.');
                cart = {};
                updateCartUI();
                closeModal();
                document.getElementById('checkoutForm').reset();
            })
            .catch(err => {
                console.error(err);
                alert('Помилка при відправці замовлення. Спробуйте ще раз.');
            })
            .finally(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('submitBtn').style.display = 'block';
            });
        }

        // Ініціалізація
        renderProducts();
    </script>
</body>
</html>
