<script>
const SHEET_ID = '1cOD58OZMbBNhZQeYU3zz90srFwKbAy6w451uOTMhZTA';
const SPREADSHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=товары`;
const REVIEWS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=відгуки`;

tailwind.config = {
theme: {
extend: {
screens: {
'xs': '390px',
}
}
}
}

let allProducts = [];
let cart = [];
let currentModalQty = 1;
let currentPhotos = [];
let currentPhotoIndex = 0;
let currentProductIndex = null;

let selectedCategory = null;
let selectedSubcategory = null;
let currentSearchTerm = "";
let currentSortOrder = "default";

let touchStartX = 0;
let touchEndX = 0;
let lightboxTouchStartX = 0;
let lightboxTouchEndX = 0;

let scale = 1;
let translateX = 0;
let translateY = 0;
let initialDistance = 0;
let lastTapTime = 0;
let startX = 0;
let startY = 0;

let loadedReviews = [];

function parseOptionsField(optionsStr) {
let result = {
sizeLabel: 'Оберіть розмір:',
sizes: [],
colorLabel: 'Оберіть колір:',
colors: [],
scentLabel: 'Оберіть запах:',
scents: []
};
if (!optionsStr || optionsStr.trim() === "") return result;

let normalized = optionsStr
.replace(/([^;\r\n]+)\s+(Розмір|Цвет|Колір|Размер|Запах|Аромат|Вкус|Смак)/gi, '$1\n$2')
.replace(/;/g, '\n');

const lines = normalized.split(/\r?\n/);

lines.forEach(line => {
const match = line.match(/([^\n\r]+?)\s*:\s*([^\n\r]+)/);
if (match && match[1] && match[2]) {
let rawLabel = match[1].trim();
let rawValues = match[2].trim();

if (/колір|кольори|цвет|цвета/i.test(rawLabel)) {
let cleanLabel = rawLabel.charAt(0).toUpperCase() + rawLabel.slice(1);
result.colorLabel = `${cleanLabel}:`;
result.colors = rawValues.split(',').map(c => c.trim()).filter(Boolean);
} else if (/запах|аромат|вкус|смак/i.test(rawLabel)) {
let cleanLabel = rawLabel.charAt(0).toUpperCase() + rawLabel.slice(1);
result.scentLabel = `${cleanLabel}:`;
result.scents = rawValues.split(',').map(s => s.trim()).filter(Boolean);
} else {
let cleanLabel = rawLabel.charAt(0).toUpperCase() + rawLabel.slice(1);
result.sizeLabel = `${cleanLabel}:`;
result.sizes = rawValues.split(',').map(s => s.trim()).filter(Boolean);
}
}
});
return result;
}

function parseSizePrice(sizeStr, defaultPrice) {
let sizeName = sizeStr;
let price = String(defaultPrice || '0').replace(/\s/g, '').replace(',', '.');

if (sizeStr.includes('-')) {
let parts = sizeStr.split('-');
sizeName = parts[0].trim();
let rawPricePart = parts[1].replace(/[^\d.,]/g, '').replace(',', '.').trim();
if (rawPricePart && !isNaN(parseFloat(rawPricePart))) {
price = parseFloat(rawPricePart).toFixed(2);
}
}
else {
let priceMatch = sizeStr.match(/\(([^)]+)\)/);
if (priceMatch && priceMatch[1]) {
sizeName = sizeStr.replace(/\s*\([^)]+\)\s*/g, '').trim();
let rawPricePart = priceMatch[1].replace(/[^\d.,]/g, '').replace(',', '.').trim();
if (rawPricePart && !isNaN(parseFloat(rawPricePart))) {
price = parseFloat(rawPricePart).toFixed(2);
}
}
}
let parsedNum = parseFloat(price);
return { sizeName, price: isNaN(parsedNum) ? '0.00' : parsedNum.toFixed(2) };
}

const parseCSV = (text) => {
let p = '', r = [];
let q = false;
let row = [''];
for (let i=0; i<text.length; i++) {
let c = text[i];
if (c === '"') { q = !q; continue; }
if (c === ',' && !q) { row.push(''); continue; }
if ((c === '\n' || c === '\r') && !q) {
if (c === '\n' && text[i-1] === '\r') continue;
r.push(row); row = ['']; continue;
}
row[row.length-1] += c;
}
if (row.length > 1 || row[0] !== '') r.push(row);
return r;
};

window.addEventListener('popstate', function () {
const modalOpen = !document.getElementById('product-modal').classList.contains('hidden');
const cartOpen = !document.getElementById('cart-modal').classList.contains('hidden');
const lightboxOpen = !document.getElementById('fullscreen-lightbox').classList.contains('hidden');
const checkoutOpen = !document.getElementById('checkout-modal').classList.contains('hidden');
const reviewsOpen = !document.getElementById('reviews-modal').classList.contains('hidden');

if (lightboxOpen) closeFullscreenPhoto(true);
else if (checkoutOpen) hideCheckoutModal(true);
else if (modalOpen) hideProductModal(true);
else if (cartOpen) hideCart(true);
else if (reviewsOpen) hideReviewsModal(true);
});

document.addEventListener('click', function(e) {
const menu = document.getElementById('sort-menu');
if (menu && !menu.classList.contains('hidden') && !e.target.closest('.relative')) {
menu.classList.add('hidden');
}
});

function showToast(message, type = 'success') {
const toast = document.createElement('div');
toast.className = 'notranslate';
const bg = type === 'success' ? '#242426' : '#ef4444';
const textColor = type === 'success' ? '#fbbf24' : '#ffffff';
const borderStyle = type === 'success' ? 'border border-[#3a3a3d]' : '';
toast.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);background:${bg};color:${textColor};padding:12px 24px;border-radius:16px;font-weight:bold;z-index:9999;box-shadow:0 10px 25px rgba(0,0,0,0.2);font-size:14px;${borderStyle}`;
toast.textContent = message;
document.body.appendChild(toast);
setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
}

async function loadReviewsFromSheet() {
try {
const response = await fetch(REVIEWS_URL);
if (!response.ok) throw new Error("Не вдалося завантажити відгуки");
const csvText = await response.text();
const rows = parseCSV(csvText);

loadedReviews = [];
for (let i = 1; i < rows.length; i++) {
const row = rows[i];
if (row && row[0] && row[0].trim() !== '') {
loadedReviews.push({
name: row[0].trim(),
text: row[1] ? row[1].trim() : '',
rating: row[2] ? parseInt(row[2].trim()) : 5,
date: row[3] ? row[3].trim() : ''
});
}
}
renderReviews();
} catch (err) {
console.error("Помилка завантаження відгуків:", err);
document.getElementById('reviews-list').innerHTML = `<div class="text-center py-6 text-slate-400">Відгуки відсутні або вкладка не налаштована.</div>`;
}
}

function renderReviews() {
const container = document.getElementById('reviews-list');
if (loadedReviews.length === 0) {
container.innerHTML = `<div class="text-center py-10 text-slate-400">Відгуків поки немає.</div>`;
return;
}
let html = '';
loadedReviews.forEach(rev => {
let stars = '⭐'.repeat(rev.rating || 5);
html += `<div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
<div class="flex justify-between items-center mb-1.5">
<span class="font-bold text-slate-800 text-sm">${rev.name}</span>
<span class="text-xs text-amber-500 font-bold flex gap-0.5">${stars}</span>
</div>
<p class="text-slate-600 text-xs leading-relaxed whitespace-pre-line">${rev.text}</p>
${rev.date ? `<div class="text-[10px] text-slate-400 mt-2 text-right">${rev.date}</div>` : ''}
</div>`;
});
container.innerHTML = html;
}

function showReviewsModal() {
document.getElementById('reviews-modal').classList.remove('hidden');
history.pushState({modal: "reviews"}, null, null);
loadReviewsFromSheet();
}

function hideReviewsModal(fromPopState = false) {
document.getElementById('reviews-modal').classList.add('hidden');
if (!fromPopState && window.history.state?.modal === "reviews") history.back();
}

async function loadProductsFromSheet() {
const CACHE_KEY = 'elmarino_opt_products_cache';
const CACHE_TIME_KEY = 'elmarino_opt_cache_time';
const CACHE_EXPIRE = 4 * 60 * 1000;

const cachedData = localStorage.getItem(CACHE_KEY);
const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
const now = Date.now();

if (cachedData && cachedTime && (now - cachedTime < CACHE_EXPIRE)) {
allProducts = JSON.parse(cachedData);
renderCategories();
applyFilterAndSort();
initSwipeListeners();
return;
}

try {
const response = await fetch(SPREADSHEET_URL);
if (!response.ok) throw new Error(`Помилка:${response.status}`);
const csvText = await response.text();

let rows = parseCSV(csvText);
allProducts = [];

for (let i = 1; i < rows.length; i++) {
const row = rows[i];
if (row && row[0] && row[0].trim() !== '') {
let imagesArray = [];
if (row[4]) {
imagesArray = row[4].split(',')
.map(url => url.trim().replace(/[\r\n]/g, ''))
.filter(Boolean);
}
let safePrice = row[2] ? row[2].trim() : '0,00';
let rawCategory = row[1] ? row[1].trim() : 'Інше';
let categoryPart = rawCategory;
let subcategoryPart = null;

if (rawCategory.includes('/')) {
let parts = rawCategory.split('/');
categoryPart = parts[0].trim();
subcategoryPart = parts[1].trim();
}

allProducts.push({
name: row[0].trim(),
category: categoryPart,
subcategory: subcategoryPart,
price: safePrice,
description: row[3] ? row[3].trim() : '',
images: imagesArray,
optionsField: row[5] ? row[5].trim() : '',
searchTags: row[6] ? row[6].trim() : ''
});
}
}

localStorage.setItem(CACHE_KEY, JSON.stringify(allProducts));
localStorage.setItem(CACHE_TIME_KEY, now.toString());

renderCategories();
applyFilterAndSort();
initSwipeListeners();
} catch (error) {
console.error(error);
if (cachedData) {
allProducts = JSON.parse(cachedData);
renderCategories();
applyFilterAndSort();
initSwipeListeners();
}
}
}

function renderCategories() {
const cats = [];
allProducts.forEach(p => {
if (p.category && !cats.includes(p.category)) cats.push(p.category);
});

let html = '';
cats.forEach(cat => {
const activeStyle = (cat === selectedCategory) ? 'border-[#3a3a3d] bg-[#242426] font-bold text-amber-400 scale-[1.02]' : 'bg-white text-slate-700 border-slate-200';
html += `<div onclick="filterByCategory('${cat}')" class="${activeStyle} p-3 rounded-2xl shadow-sm text-center text-xs font-semibold cursor-pointer border hover:border-amber-400 transition-all">${cat}</div>`;
});
document.getElementById('categories').innerHTML = html;
renderSubcategories();
}

function renderSubcategories() {
const subContainer = document.getElementById('subcategories');
if (!selectedCategory) {
subContainer.classList.add('hidden');
return;
}

const subcats = [];
allProducts.forEach(p => {
if (p.category === selectedCategory && p.subcategory && !subcats.includes(p.subcategory)) {
subcats.push(p.subcategory);
}
});

if (subcats.length === 0) {
subContainer.classList.add('hidden');
return;
}

subContainer.classList.remove('hidden');
let html = '';
subcats.forEach(sub => {
const activeStyle = (sub === selectedSubcategory) ? 'border-[#3b2d2c] bg-[#4a3e3d] font-bold text-amber-400 shadow-md scale-[1.01]' : 'bg-white text-[#5c4a44] border-[#dfc3b0] hover:border-[#cbb09d]';
html += `<div onclick="filterBySubcategory('${sub}')" class="${activeStyle} p-2.5 rounded-xl shadow-sm text-center text-xs font-semibold cursor-pointer border transition-all truncate">${sub}</div>`;
});
subContainer.innerHTML = html;
}

function applyFilterAndSort() {
let filtered = [...allProducts];
if (selectedCategory) filtered = filtered.filter(p => p.category === selectedCategory);
if (selectedSubcategory) filtered = filtered.filter(p => p.subcategory === selectedSubcategory);
if (currentSearchTerm) {
filtered = filtered.filter(p =>
p.name.toLowerCase().includes(currentSearchTerm) ||
(p.description && p.description.toLowerCase().includes(currentSearchTerm)) ||
(p.searchTags && p.searchTags.toLowerCase().includes(currentSearchTerm))
);
}
if (currentSortOrder === 'low-to-high') {
filtered.sort((a, b) => parseFloat(a.price.replace(',', '.')) - parseFloat(b.price.replace(',', '.')));
} else if (currentSortOrder === 'high-to-low') {
filtered.sort((a, b) => parseFloat(b.price.replace(',', '.')) - parseFloat(a.price.replace(',', '.')));
}
updateFilterIndicator();
renderProducts(filtered);
}

function renderProducts(products) {
let html = '';
products.forEach((p, idx) => {
const realIndex = allProducts.findIndex(item => item.name === p.name);
const mainImage = p.images.length > 0 ? p.images[0] : 'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=300&q=60';
const loadingType = idx < 4 ? 'eager' : 'lazy';

html += `<div onclick="showProductDetails(${realIndex})" class="product-card bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 flex flex-col justify-between">
<div>
<div class="w-full h-40 bg-slate-50 flex items-center justify-center overflow-hidden">
<img src="${mainImage}" class="max-w-full max-h-full object-contain" loading="${loadingType}">
</div>
<div class="p-3">
<h3 class="text-sm font-bold text-slate-800 leading-tight line-clamp-2 min-h-[40px]">${p.name}</h3>
<p class="text-slate-500 text-xs mt-1 min-h-[32px] clamp-desc">${p.description}</p>
</div>
</div>
<div class="p-3 pt-0">
<p class="text-slate-800 font-black text-base">${p.price} грн <span class="text-[10px] text-amber-600 font-bold block">опт</span></p>
<button onclick="addToCartFromList(${realIndex}); event.stopPropagation();" class="mt-2 w-full bg-[#242426] active:bg-[#323235] text-amber-400 py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm border border-[#3a3a3d]">В замовлення</button>
</div>
</div>`;
});
document.getElementById('products').innerHTML = html || '<p class="col-span-2 text-center py-10 text-slate-500">Товарів не знайдено</p>';
}

function toggleSortMenu() { document.getElementById('sort-menu').classList.toggle('hidden'); }
function setSortOrder(order) { currentSortOrder = order; document.getElementById('sort-menu').classList.add('hidden'); applyFilterAndSort(); }

function filterByCategory(cat) {
if (selectedCategory === cat) {
selectedCategory = null;
selectedSubcategory = null;
} else {
selectedCategory = cat;
selectedSubcategory = null;
}
renderCategories();
applyFilterAndSort();
if (selectedCategory) {
setTimeout(() => {
const anchorEl = document.getElementById('subcat-anchor');
if (anchorEl) anchorEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}, 80);
}
}

function filterBySubcategory(sub) {
selectedSubcategory = (selectedSubcategory === sub) ? null : sub;
renderSubcategories();
applyFilterAndSort();
if (selectedSubcategory) {
setTimeout(() => {
const anchorEl = document.getElementById('subcat-anchor');
if (anchorEl) anchorEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}, 50);
}
}

function filterProducts() { currentSearchTerm = document.getElementById('search').value.toLowerCase(); applyFilterAndSort(); }
function resetFilters() { selectedCategory = null; selectedSubcategory = null; document.getElementById('search').value = ''; currentSearchTerm = ""; renderCategories(); applyFilterAndSort(); }
function goHome() { selectedCategory = null; selectedSubcategory = null; currentSearchTerm = ""; currentSortOrder = "default"; document.getElementById('search').value = ''; renderCategories(); applyFilterAndSort(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function updateFilterIndicator() {
const indicator = document.getElementById('filter-indicator');
const textEl = document.getElementById('filter-indicator-text');
let parts = [];
if (selectedCategory) parts.push(`Категорія: <b>${selectedCategory}</b>`);
if (selectedSubcategory) parts.push(`Підкатегорія: <b>${selectedSubcategory}</b>`);
if (currentSearchTerm) parts.push(`Пошук: <b>"${currentSearchTerm}"</b>`);
if (parts.length > 0) { indicator.classList.remove('hidden'); indicator.classList.add('flex'); textEl.innerHTML = parts.join(' | '); }
else { indicator.classList.add('hidden'); indicator.classList.remove('flex'); }
}

function addToCartFromList(index) {
const p = allProducts[index];
const parsedData = parseOptionsField(p.optionsField);
let defaultSize = parsedData.sizes.length > 0 ? parseSizePrice(parsedData.sizes[0], p.price).sizeName : null;
let basePrice = parsedData.sizes.length > 0 ? parseSizePrice(parsedData.sizes[0], p.price).price : p.price;
let defaultColor = parsedData.colors.length > 0 ? parsedData.colors[0] : null;
let defaultScent = parsedData.scents.length > 0 ? parsedData.scents[0] : null;

addToCart(index, 1, defaultSize, defaultColor, defaultScent, basePrice);
}

function showProductDetails(index) {
currentProductIndex = index;
const p = allProducts[index];
currentModalQty = 1;
document.getElementById('modal-qty').textContent = currentModalQty;

let validImages = [];
if (p.images && p.images.length > 0) {
validImages = p.images.map(url => url.trim()).filter(url => url.startsWith('http'));
}

currentPhotos = validImages.length > 0 ? validImages : ['https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400&q=60'];
currentPhotoIndex = 0;
updateModalPhoto();

let displayCategoryName = p.category;
if (p.subcategory) displayCategoryName += ` / ${p.subcategory}`;
document.getElementById('modal-product-category').textContent = displayCategoryName;
document.getElementById('modal-product-name').textContent = p.name;
document.getElementById('modal-product-description').textContent = p.description || 'Опис відсутній';

const sizeSelect = document.getElementById('modal-size-select');
const sizeBlock = document.getElementById('size-selector-block');
const sizeLabel = document.getElementById('modal-size-label');

const colorSelect = document.getElementById('modal-color-select');
const colorBlock = document.getElementById('color-selector-block');
const colorLabel = document.getElementById('modal-color-label');

const scentSelect = document.getElementById('modal-scent-select');
const scentBlock = document.getElementById('scent-selector-block');
const scentLabel = document.getElementById('modal-scent-label');

const parsedData = parseOptionsField(p.optionsField);

if (parsedData.sizes.length > 0) {
sizeBlock.classList.remove('hidden');
sizeLabel.textContent = parsedData.sizeLabel;
sizeSelect.innerHTML = parsedData.sizes.map((s, idx) => {
let parsed = parseSizePrice(s, p.price);
let isSelected = idx === 0 ? 'selected' : '';
return `<option value="${parsed.sizeName}" data-price="${parsed.price}" ${isSelected}>${s}</option>`;
}).join('');
} else {
sizeBlock.classList.add('hidden');
sizeSelect.innerHTML = '';
}

if (parsedData.colors.length > 0) {
colorBlock.classList.remove('hidden');
colorLabel.textContent = parsedData.colorLabel;
colorSelect.innerHTML = parsedData.colors.map((c, idx) => {
let isSelected = idx === 0 ? 'selected' : '';
return `<option value="${c}" data-index="${idx}" ${isSelected}>${c}</option>`;
}).join('');
} else {
colorBlock.classList.add('hidden');
colorSelect.innerHTML = '';
}

if (parsedData.scents.length > 0) {
scentBlock.classList.remove('hidden');
scentLabel.textContent = parsedData.scentLabel;
scentSelect.innerHTML = parsedData.scents.map((sc, idx) => {
let isSelected = idx === 0 ? 'selected' : '';
return `<option value="${sc}" ${isSelected}>${sc}</option>`;
}).join('');
} else {
scentBlock.classList.add('hidden');
scentSelect.innerHTML = '';
}

updateModalPrice();
setTimeout(() => { syncColorByPhoto(); }, 10);

document.getElementById('modal-product-btn').onclick = function() {
let chosenSize = (!sizeBlock.classList.contains('hidden')) ? sizeSelect.value : null;
let chosenColor = (!colorBlock.classList.contains('hidden')) ? colorSelect.value : null;
let chosenScent = (!scentBlock.classList.contains('hidden')) ? scentSelect.value : null;

if (!sizeBlock.classList.contains('hidden') && !chosenSize) {
showToast("❌ Будь ласка, оберіть потрібний варіант!", "error");
return;
}
if (!colorBlock.classList.contains('hidden') && !chosenColor) {
showToast("❌ Будь ласка, оберіть колір товару!", "error");
return;
}
if (!scentBlock.classList.contains('hidden') && !chosenScent) {
showToast("❌ Будь ласка, оберіть запах товару!", "error");
return;
}

let activePrice = p.price;
if (!sizeBlock.classList.contains('hidden') && sizeSelect.selectedOptions.length > 0) {
activePrice = sizeSelect.selectedOptions[0].getAttribute('data-price');
}
addToCart(index, currentModalQty, chosenSize, chosenColor, chosenScent, activePrice);
hideProductModal();
};

history.pushState({modal: "product"}, null, null);
document.getElementById('product-modal').classList.remove('hidden');
}

function updateModalPrice() {
if (currentProductIndex === null) return;
const p = allProducts[currentProductIndex];
const sizeSelect = document.getElementById('modal-size-select');
const sizeBlock = document.getElementById('size-selector-block');

let activePrice = p.price;
if (!sizeBlock.classList.contains('hidden') && sizeSelect.value && sizeSelect.selectedOptions.length > 0) {
activePrice = sizeSelect.selectedOptions[0].getAttribute('data-price');
}
let cleanNum = parseFloat(String(activePrice).replace(/\s/g, '').replace(',', '.'));
if (isNaN(cleanNum)) cleanNum = 0;
let totalPrice = cleanNum * currentModalQty;
document.getElementById('modal-product-price').textContent = totalPrice.toFixed(2).replace('.', ',') + ' грн';
}

function updateModalPhoto() {
if (currentPhotos.length === 0) return;
document.getElementById('modal-product-image').src = currentPhotos[currentPhotoIndex];
const prevBtn = document.getElementById('prev-photo-btn');
const nextBtn = document.getElementById('next-photo-btn');
const counter = document.getElementById('photo-counter');

if (currentPhotos.length > 1) {
prevBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden'); counter.classList.remove('hidden');
counter.textContent = `${currentPhotoIndex + 1} із ${currentPhotos.length}`;
} else {
prevBtn.classList.add('hidden'); nextBtn.classList.add('hidden'); counter.classList.add('hidden');
}
}

function syncColorByPhoto() {
const colorSelect = document.getElementById('modal-color-select');
const colorBlock = document.getElementById('color-selector-block');
if (!colorSelect || colorBlock.classList.contains('hidden') || !colorSelect.options.length) return;
let expectedSelectedIndex = currentPhotoIndex;
if (expectedSelectedIndex < colorSelect.options.length) colorSelect.selectedIndex = expectedSelectedIndex;
}

function syncPhotoByColor() {
const colorSelect = document.getElementById('modal-color-select');
if (!colorSelect || !colorSelect.options.length) return;
let selectedIdx = colorSelect.selectedIndex;
if (selectedIdx >= 0 && selectedIdx < currentPhotos.length) {
currentPhotoIndex = selectedIdx;
updateModalPhoto();
if (!document.getElementById('fullscreen-lightbox').classList.contains('hidden')) updateLightboxImage();
}
}

function changePhoto(direction) {
if (currentPhotos.length <= 1) return;
currentPhotoIndex += direction;
if (currentPhotoIndex < 0) currentPhotoIndex = currentPhotos.length - 1;
if (currentPhotoIndex >= currentPhotos.length) currentPhotoIndex = 0;
resetZoom();
updateModalPhoto();
syncColorByPhoto();
if (!document.getElementById('fullscreen-lightbox').classList.contains('hidden')) updateLightboxImage();
}

function changeModalQty(delta) {
currentModalQty += delta;
if (currentModalQty < 1) currentModalQty = 1;
document.getElementById('modal-qty').textContent = currentModalQty;
updateModalPrice();
}

function hideProductModal(fromPopState = false) {
document.getElementById('product-modal').classList.add('hidden');
currentProductIndex = null;
if (!fromPopState && window.history.state?.modal === "product") history.back();
}

function openFullscreenPhoto() {
if (currentPhotos.length === 0) return;
const lightbox = document.getElementById('fullscreen-lightbox');
lightbox.classList.remove('hidden');
resetZoom();
updateLightboxImage();
history.pushState({modal: "lightbox"}, null, null);
}

function updateLightboxImage() {
const img = document.getElementById('lightbox-img');
img.src = currentPhotos[currentPhotoIndex];
const prevBtn = document.getElementById('lightbox-prev-btn');
const nextBtn = document.getElementById('lightbox-next-btn');
if (currentPhotos.length > 1) {
prevBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden');
} else {
prevBtn.classList.add('hidden'); nextBtn.classList.add('hidden');
}
}

function closeFullscreenPhoto(fromPopState = false) {
document.getElementById('fullscreen-lightbox').classList.add('hidden');
resetZoom();
if (!fromPopState && window.history.state?.modal === "lightbox") history.back();
}

function resetZoom() {
scale = 1; translateX = 0; translateY = 0; updateTransform();
}

function updateTransform() {
const img = document.getElementById('lightbox-img');
if (img) img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

function addToCart(index, qty, size, color, scent, customPrice) {
const p = allProducts[index];
let unitPrice = customPrice !== undefined ? customPrice : p.price;
let cleanNum = parseFloat(String(unitPrice).replace(/\s/g, '').replace(',', '.'));
if (isNaN(cleanNum)) cleanNum = 0;

let cartItem = {
name: p.name,
price: cleanNum,
qty: qty,
size: size,
color: color,
scent: scent,
image: p.images.length > 0 ? p.images[0] : ''
};

let existingIndex = cart.findIndex(item => 
item.name === cartItem.name && 
item.size === cartItem.size && 
item.color === cartItem.color && 
item.scent === cartItem.scent
);

if (existingIndex > -1) {
cart[existingIndex].qty += qty;
} else {
cart.push(cartItem);
}

updateCartCounter();
showToast(`✅ ${p.name} додано в оптове замовлення!`);
}

function updateCartCounter() {
let totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
document.getElementById('cart-count').textContent = totalCount;
}

function showCart() {
renderCartItems();
document.getElementById('cart-modal').classList.remove('hidden');
history.pushState({modal: "cart"}, null, null);
}

function hideCart(fromPopState = false) {
document.getElementById('cart-modal').classList.add('hidden');
if (!fromPopState && window.history.state?.modal === "cart") history.back();
}

function renderCartItems() {
const container = document.getElementById('cart-items');
if (cart.length === 0) {
container.innerHTML = `<div class="text-center py-10 text-slate-400 font-medium">Ваш оптовий кошик порожній 🛒</div>`;
document.getElementById('cart-total').textContent = '0 грн';
return;
}

let html = '';
let totalSum = 0;

cart.forEach((item, index) => {
let itemTotal = item.price * item.qty;
totalSum += itemTotal;

let optionsText = [];
if (item.size) optionsText.push(`Варіант: <b>${item.size}</b>`);
if (item.color) optionsText.push(`Колір: <b>${item.color}</b>`);
if (item.scent) optionsText.push(`Запах: <b>${item.scent}</b>`);

html += `<div class="flex items-center justify-between bg-slate-50 p-3 rounded-2xl border border-slate-100 gap-3">
<div class="w-16 h-16 bg-white rounded-xl flex items-center justify-center overflow-hidden shrink-0 border">
<img src="${item.image || 'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=100&q=60'}" class="max-w-full max-h-full object-contain">
</div>
<div class="flex-1 min-w-0">
<h4 class="text-xs font-bold text-slate-800 truncate">${item.name}</h4>
${optionsText.length > 0 ? `<p class="text-[11px] text-slate-500 mt-0.5">${optionsText.join(' | ')}</p>` : ''}
<div class="flex items-center gap-2 mt-2">
<button onclick="changeCartQty(${index}, -1)" class="w-7 h-7 bg-white rounded-lg border font-bold text-sm shadow-sm">-</button>
<span class="text-xs font-bold text-slate-800">${item.qty}</span>
<button onclick="changeCartQty(${index}, 1)" class="w-7 h-7 bg-white rounded-lg border font-bold text-sm shadow-sm">+</button>
<span class="text-xs font-black text-slate-800 ml-auto">${itemTotal.toFixed(2).replace('.', ',')} грн</span>
</div>
</div>
<button onclick="removeFromCart(${index})" class="text-slate-400 hover:text-red-500 text-lg p-1">✕</button>
</div>`;
});

container.innerHTML = html;
document.getElementById('cart-total').textContent = totalSum.toFixed(2).replace('.', ',') + ' грн';
}

function changeCartQty(index, delta) {
cart[index].qty += delta;
if (cart[index].qty <= 0) cart.splice(index, 1);
updateCartCounter();
renderCartItems();
}

function removeFromCart(index) {
cart.splice(index, 1);
updateCartCounter();
renderCartItems();
}

function showCheckoutModal() {
if (cart.length === 0) {
showToast("❌ Кошик порожній!", "error");
return;
}
hideCart(true);
document.getElementById('checkout-modal').classList.remove('hidden');
history.pushState({modal: "checkout"}, null, null);
}

function hideCheckoutModal(fromPopState = false) {
document.getElementById('checkout-modal').classList.add('hidden');
if (!fromPopState && window.history.state?.modal === "checkout") history.back();
}

function submitOrder() {
let name = document.getElementById('customer-name').value.trim();
let phone = document.getElementById('customer-phone').value.trim();

if (!name || !phone) {
showToast("❌ Будь ласка, введіть ім'я та номер телефону!", "error");

function initSwipeListeners() {
const zone = document.getElementById('modal-swipe-zone');
if (!zone) return;

zone.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
zone.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, {passive: true});

const lightbox = document.getElementById('fullscreen-lightbox');
const lightboxImg = document.getElementById('lightbox-img');
if (!lightbox || !lightboxImg) return;

lightbox.addEventListener('touchstart', e => {
if (e.touches.length === 2) {
initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
} else if (e.touches.length === 1) {
startX = e.touches[0].clientX - translateX;
startY = e.touches[0].clientY - translateY;
lightboxTouchStartX = e.touches[0].screenX;
}
}, {passive: true});

lightbox.addEventListener('touchmove', e => {
if (e.touches.length === 2) {
let currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
if (initialDistance > 0) {
let factor = currentDistance / initialDistance;
scale = Math.min(Math.max(1, scale * (factor > 1 ? 1.05 : 0.95)), 4);
updateTransform();
}
} else if (e.touches.length === 1 && scale > 1) {
translateX = e.touches[0].clientX - startX;
translateY = e.touches[0].clientY - startY;
updateTransform();
}
}, {passive: true});

lightbox.addEventListener('touchend', e => {
if (e.changedTouches.length === 1 && scale === 1) {
lightboxTouchEndX = e.changedTouches[0].screenX;
handleLightboxSwipe();
}
if (e.touches.length < 2) initialDistance = 0;
if (scale <= 1) resetZoom();
}, {passive: true});

lightboxImg.addEventListener('click', e => {
let currentTime = new Date().getTime();
let tapLength = currentTime - lastTapTime;
if (tapLength < 300 && tapLength > 0) {
if (scale > 1) resetZoom();
else { scale = 2.5; updateTransform(); }
e.stopPropagation();
}
lastTapTime = currentTime;
});
}

function handleSwipe() {
const threshold = 50;
if (touchEndX < touchStartX - threshold) changePhoto(1);
if (touchEndX > touchStartX + threshold) changePhoto(-1);
}

function handleLightboxSwipe() {
const threshold = 50;
if (lightboxTouchEndX < lightboxTouchStartX - threshold) { changePhoto(1); updateLightboxImage(); }
if (lightboxTouchEndX > lightboxTouchStartX + threshold) { changePhoto(-1); updateLightboxImage(); }
}

window.onload = function() {
loadProductsFromSheet();
};
</script>
