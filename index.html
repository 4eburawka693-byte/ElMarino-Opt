<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Marino — Опт</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .clamp-desc {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-800">

    <!-- Шапка -->
    <header class="bg-[#1a1a1c] text-white p-4 sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight text-amber-400">El Marino <span class="text-xs font-normal text-slate-300 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">Опт</span></h1>
            <button onclick="showCartModal()" class="relative p-2 bg-[#2a2a2d] rounded-full border border-slate-700">
                🛒
                <span id="cart-counter" class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
            </button>
        </div>
    </header>

    <!-- Поиск и фильтры -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div>
            <input type="text" id="search-input" oninput="filterProducts()" placeholder="🔍 Пошук товарів..." class="w-full bg-white border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-amber-500 shadow-sm">
        </div>

        <!-- Категории -->
        <div id="categories" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
            <button onclick="selectCategory('all')" class="cat-btn active bg-amber-500 text-slate-950 px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap shadow-sm">Всі</button>
        </div>

        <!-- Список товаров -->
        <div id="products" class="grid grid-cols-2 gap-3">
            <p class="col-span-2 text-center py-10 text-slate-400 text-sm">Завантаження товарів...</p>
        </div>
    </main>

    <!-- Модалка товара -->
    <div id="product-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden flex items-end justify-center sm:items-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[85vh] overflow-y-auto relative animate-fade-in space-y-4">
            <button onclick="hideProductModal()" class="absolute top-4 right-4 bg-slate-100 p-2 rounded-full text-slate-500 hover:bg-slate-200 text-xs font-bold w-8 h-8 flex items-center justify-center">✕</button>
            
            <div id="modal-gallery" class="w-full h-56 bg-slate-50 rounded-2xl flex items-center justify-center overflow-hidden">
                <img id="modal-img" src="" class="max-w-full max-h-full object-contain">
            </div>

            <div id="modal-thumbnails" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>

            <div>
                <h2 id="modal-title" class="text-lg font-bold text-slate-900 leading-snug"></h2>
                <p id="modal-desc" class="text-xs text-slate-500 mt-1"></p>
            </div>

            <!-- Опции товара (Вариант/Цвет/Запах) -->
            <div id="modal-options" class="space-y-3"></div>

            <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                <div>
                    <span class="text-[10px] text-amber-800 font-bold bg-amber-50 px-2 py-0.5 rounded border border-amber-200">Оптова ціна</span>
                    <p id="modal-price" class="text-xl font-black text-slate-900 mt-0.5"></p>
                </div>
                <button onclick="addToCartFromModal()" class="bg-[#242426] active:bg-[#323235] text-amber-400 px-6 py-3 rounded-2xl font-bold text-sm shadow-md border border-[#3a3a3d]">Додати в кошик</button>
            </div>
        </div>
    </div>

    <!-- Модалка корзины -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden flex items-end justify-center sm:items-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[85vh] overflow-y-auto relative flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <h2 class="text-lg font-bold text-slate-900">Кошик</h2>
                    <button onclick="hideCartModal()" class="bg-slate-100 p-2 rounded-full text-slate-500 text-xs font-bold w-8 h-8 flex items-center justify-center">✕</button>
                </div>

                <div id="cart-items" class="divide-y divide-slate-100 my-4 space-y-3 max-h-[40vh] overflow-y-auto pr-1"></div>
            </div>

            <div class="pt-3 border-t border-slate-100 space-y-3">
                <div class="flex justify-between items-center text-base font-bold text-slate-900">
                    <span>Разом к оплаті:</span>
                    <span id="cart-total">0 грн</span>
                </div>
                <button onclick="showCheckoutModal()" class="w-full bg-[#242426] text-amber-400 py-3.5 rounded-2xl font-bold text-sm shadow-md border border-[#3a3a3d]">Оформити замовлення</button>
            </div>
        </div>
    </div>

    <!-- Модалка оформления заказа -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end justify-center sm:items-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 relative space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                <h2 class="text-lg font-bold text-slate-900">📝 Оформити замовлення</h2>
                <button onclick="hideCheckoutModal()" class="bg-slate-100 p-2 rounded-full text-slate-500 text-xs font-bold w-8 h-8 flex items-center justify-center">✕</button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">ВАШЕ ІМ'Я:</label>
                    <input type="text" id="customer-name" placeholder="Введіть ім'я" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">НОМЕР ТЕЛЕФОНУ:</label>
                    <input type="tel" id="customer-phone" placeholder="+380..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <button onclick="submitOrder()" class="w-full bg-[#242426] text-amber-400 py-3.5 rounded-2xl font-bold text-sm shadow-md border border-[#3a3a3d] flex items-center justify-center gap-2">
                🚀 Надіслати замовлення
            </button>
        </div>
    </div>

    <!-- Уведомления (Toast) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg z-50 hidden transition-all duration-300"></div>

    <script>
        // Универсальный парсер CSV/TSV
        const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1L9L91T23f9i_P34M-3M2-G8V8264N_M2-G8V/pub?output=csv';

        let allProducts = [];
        let activeCategory = 'all';
        let currentModalProduct = null;
        let selectedOptions = { size: null, color: null, scent: null };
        let cart = [];

        async function fetchProducts() {
            try {
                const response = await fetch(SPREADSHEET_URL);
                const data = await response.text();
                parseData(data);
            } catch (e) {
                console.error("Ошибка загрузки данных", e);
                document.getElementById('products').innerHTML = '<p class="col-span-2 text-center py-10 text-red-500">Помилка завантаження товарів</p>';
            }
        }

        // Вспомогательная функция разбора CSV
        function parseCSVLine(text) {
            let result = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if ((c === ',' || c === '\t') && !inQuotes) {
                    result.push(cell.trim());
                    cell = '';
                } else {
                    cell += c;
                }
            }
            result.push(cell.trim());
            return result;
        }

        function parseData(text) {
            const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
            if (lines.length <= 1) return;

            const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().replace(/^"|"$/g, '').trim());
            allProducts = [];
            const categoriesSet = new Set();

            for (let i = 1; i < lines.length; i++) {
                const row = parseCSVLine(lines[i]).map(val => val.replace(/^"|"$/g, '').trim());
                if (row.length < 2) continue;

                let p = {};
                headers.forEach((h, idx) => {
                    p[h] = row[idx] ? row[idx] : '';
                });

                if (!p.name) continue;

                let images = [];
                if (p.images) {
                    images = p.images.split(',').map(url => url.trim()).filter(url => url);
                }

                const product = {
                    name: p.name || 'Товар без назви',
                    category: p.category || 'Різне',
                    description: p.description || '',
                    price: p.price || '0',
                    images: images,
                    sizes: p.sizes ? p.sizes.split(',').map(s => s.trim()) : [],
                    colors: p.colors ? p.colors.split(',').map(c => c.trim()) : [],
                    scents: p.scents ? p.scents.split(',').map(s => s.trim()) : []
                };

                categoriesSet.add(product.category);
                allProducts.push(product);
            }

            renderCategories(Array.from(categoriesSet));
            renderProducts(allProducts);
        }

        function renderCategories(categories) {
            const container = document.getElementById('categories');
            let html = `<button onclick="selectCategory('all')" class="cat-btn ${activeCategory === 'all' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-white text-slate-600'} px-4 py-1.5 rounded-full text-xs whitespace-nowrap shadow-sm border border-slate-200">Всі</button>`;
            
            categories.forEach(cat => {
                html += `<button onclick="selectCategory('${cat}')" class="cat-btn ${activeCategory === cat ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-white text-slate-600'} px-4 py-1.5 rounded-full text-xs whitespace-nowrap shadow-sm border border-slate-200">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        function selectCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText === (cat === 'all' ? 'Всі' : cat)) {
                    btn.className = 'cat-btn bg-amber-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs whitespace-nowrap shadow-sm border border-slate-200';
                } else {
                    btn.className = 'cat-btn bg-white text-slate-600 px-4 py-1.5 rounded-full text-xs whitespace-nowrap shadow-sm border border-slate-200';
                }
            });
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = allProducts.filter(p => {
                const matchCat = activeCategory === 'all' || p.category === activeCategory;
                const matchSearch = p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });
            renderProducts(filtered);
        }

        function renderProducts(products) {
            let html = '';
            products.forEach((p, idx) => {
                const realIndex = allProducts.findIndex(item => item.name === p.name);
                const mainImage = p.images.length > 0 ? p.images[0] : 'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=300&q=60';

                const loadingAttr = idx < 4 ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"';

                html += `<div onclick="showProductDetails(${realIndex})" class="product-card bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 flex flex-col justify-between">
                <div>
                    <div class="w-full h-40 bg-slate-50 flex items-center justify-center overflow-hidden relative">
                        <img src="${mainImage}" class="max-w-full max-h-full object-contain transition-opacity duration-300" ${loadingAttr} decoding="async">
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-bold text-slate-800 leading-tight line-clamp-2 min-h-[40px]">${p.name}</h3>
                        <p class="text-slate-500 text-xs mt-1 min-h-[32px] clamp-desc">${p.description}</p>
                    </div>
                </div>
                <div class="p-3 pt-0">
                    <span class="text-[10px] font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded border border-amber-200/80 inline-block mb-1">Оптова ціна</span>
                    <p class="text-slate-800 font-black text-base">${p.price} грн</p>
                    <button onclick="addToCartFromList(${realIndex}); event.stopPropagation();" class="mt-2 w-full bg-[#242426] active:bg-[#323235] text-amber-400 py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm border border-[#3a3a3d]">В кошик</button>
                </div>
                </div>`;
            });
            document.getElementById('products').innerHTML = html || '<p class="col-span-2 text-center py-10 text-slate-500">Товарів не знайдено</p>';
        }

        function showProductDetails(index) {
            currentModalProduct = allProducts[index];
            selectedOptions = { size: null, color: null, scent: null };

            document.getElementById('modal-title').innerText = currentModalProduct.name;
            document.getElementById('modal-desc').innerText = currentModalProduct.description;
            document.getElementById('modal-price').innerText = `${currentModalProduct.price} грн`;

            const mainImg = document.getElementById('modal-img');
            mainImg.src = currentModalProduct.images[0] || 'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=300&q=60';

            const thumbsContainer = document.getElementById('modal-thumbnails');
            thumbsContainer.innerHTML = '';
            if (currentModalProduct.images.length > 1) {
                currentModalProduct.images.forEach(imgUrl => {
                    const thumb = document.createElement('img');
                    thumb.src = imgUrl;
                    thumb.className = 'w-12 h-12 object-contain rounded-lg border border-slate-200 cursor-pointer p-1 bg-slate-50';
                    thumb.onclick = () => { mainImg.src = imgUrl; };
                    thumbsContainer.appendChild(thumb);
                });
            }

            const optionsContainer = document.getElementById('modal-options');
            optionsContainer.innerHTML = '';

            if (currentModalProduct.sizes.length > 0) {
                optionsContainer.appendChild(createOptionGroup('Варіант / Розмір:', currentModalProduct.sizes, 'size'));
                selectedOptions.size = currentModalProduct.sizes[0];
            }
            if (currentModalProduct.colors.length > 0) {
                optionsContainer.appendChild(createOptionGroup('Колір:', currentModalProduct.colors, 'color'));
                selectedOptions.color = currentModalProduct.colors[0];
            }
            if (currentModalProduct.scents.length > 0) {
                optionsContainer.appendChild(createOptionGroup('Запах:', currentModalProduct.scents, 'scent'));
                selectedOptions.scent = currentModalProduct.scents[0];
            }

            document.getElementById('product-modal').classList.remove('hidden');
        }

        function createOptionGroup(title, items, type) {
            const div = document.createElement('div');
            div.innerHTML = `<p class="text-xs font-bold text-slate-600 mb-1.5">${title}</p>`;
            const flex = document.createElement('div');
            flex.className = 'flex flex-wrap gap-2';

            items.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium border transition-all ${idx === 0 ? 'bg-amber-500 text-slate-950 font-bold border-amber-500' : 'bg-slate-50 text-slate-700 border-slate-200'}`;
                btn.innerText = item;
                btn.onclick = () => {
                    flex.querySelectorAll('button').forEach(b => b.className = 'px-3 py-1.5 rounded-lg text-xs font-medium border bg-slate-50 text-slate-700 border-slate-200');
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium border bg-amber-500 text-slate-950 font-bold border-amber-500';
                    selectedOptions[type] = item;
                };
                flex.appendChild(btn);
            });
            div.appendChild(flex);
            return div;
        }

        function hideProductModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function addToCartFromList(index) {
            const product = allProducts[index];
            addToCart(product, {
                size: product.sizes[0] || null,
                color: product.colors[0] || null,
                scent: product.scents[0] || null
            });
        }

        function addToCartFromModal() {
            if (!currentModalProduct) return;
            addToCart(currentModalProduct, { ...selectedOptions });
            hideProductModal();
        }

        function addToCart(product, options) {
            const existingIndex = cart.findIndex(item => 
                item.name === product.name &&
                item.size === options.size &&
                item.color === options.color &&
                item.scent === options.scent
            );

            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({
                    name: product.name,
                    price: product.price,
                    size: options.size,
                    color: options.color,
                    scent: options.scent,
                    qty: 1
                });
            }
            updateCartCounter();
            showToast("✅ Товар додано в кошик");
        }

        function updateCartCounter() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const counterEl = document.getElementById('cart-counter');
            if (count > 0) {
                counterEl.innerText = count;
                counterEl.classList.remove('hidden');
            } else {
                counterEl.classList.add('hidden');
            }
        }

        function showCartModal() {
            renderCartItems();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function hideCartModal() { document.getElementById('cart-modal').classList.add('hidden'); }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 text-sm py-6">Кошик порожній</p>';
                document.getElementById('cart-total').innerText = '0 грн';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, idx) => {
                let cleanPrice = parseFloat(String(item.price).replace(/\s/g, '').replace(',', '.'));
                let itemTotal = cleanPrice * item.qty;
                total += itemTotal;

                let details = [];
                if (item.size) details.push(item.size);
                if (item.color) details.push(item.color);
                if (item.scent) details.push(item.scent);
                let detailsStr = details.length > 0 ? `<p class="text-[11px] text-slate-400">${details.join(', ')}</p>` : '';

                html += `<div class="flex items-center justify-between py-2">
                    <div class="pr-2">
                        <p class="text-xs font-bold text-slate-800 leading-tight">${item.name}</p>
                        ${detailsStr}
                        <p class="text-xs font-semibold text-slate-600 mt-0.5">${item.price} грн</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${idx}, -1)" class="w-6 h-6 bg-slate-100 rounded text-slate-700 font-bold text-xs">-</button>
                        <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                        <button onclick="changeQty(${idx}, 1)" class="w-6 h-6 bg-slate-100 rounded text-slate-700 font-bold text-xs">+</button>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
            document.getElementById('cart-total').innerText = `${total.toFixed(2).replace('.', ',')} грн`;
        }

        function changeQty(idx, delta) {
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            updateCartCounter();
            renderCartItems();
        }

        function showCheckoutModal() {
            if (cart.length === 0) {
                showToast("❌ Спочатку додайте товари в кошик!");
                return;
            }
            hideCartModal();
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function hideCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); }

        function submitOrder() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();

            if (!name || !phone) {
                showToast("❌ Будь ласка, заповніть ім'я та телефон!");
                return;
            }

            let totalSumNum = 0;
            let messageText = `🛍️ НОВЕ ОПТОВЕ ЗАМОВЛЕННЯ!\n\n`;
            messageText += `👤 Ім'я: ${name}\n`;
            messageText += `📞 Телефон: ${phone}\n\n`;
            messageText += `📦 Товари:\n`;

            cart.forEach((item, i) => {
                let cleanPrice = parseFloat(String(item.price).replace(/\s/g, '').replace(',', '.'));
                let itemTotal = cleanPrice * item.qty;
                totalSumNum += itemTotal;

                let details = [];
                if (item.size) details.push(`Варіант: ${item.size}`);
                if (item.color) details.push(`Колір: ${item.color}`);
                if (item.scent) details.push(`Запах: ${item.scent}`);
                let detailsStr = details.length > 0 ? ` (${details.join(', ')})` : '';

                messageText += `${i+1}. ${item.name}${detailsStr}\n   └ ${item.qty} шт. × ${item.price} грн = ${itemTotal.toFixed(2).replace('.', ',')} грн\n`;
            });

            let totalSumStr = totalSumNum.toFixed(2).replace('.', ',');
            messageText += `\n💰 Загальна сума: ${totalSumStr} грн`;

            const telegramUrl = `https://t.me/ElMarinooptbot?text=${encodeURIComponent(messageText)}`;

            cart = [];
            updateCartCounter();
            hideCheckoutModal();

            window.location.href = telegramUrl;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        fetchProducts();
    </script>
</body>
</html>
